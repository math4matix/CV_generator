<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator CV</title>
</head>

<body>
    <div>
        <label for="pdf-url">PDF URL</label>
        <input id="pdf-url" type="url" required>
        <button id="load-pdf-url" type="button">Load PDF URL</button>
    </div>
    <div>
        <label for="pdf-file">Or choose a local PDF</label>
        <input id="pdf-file" type="file" accept="application/pdf,.pdf" required>
        <button id="load-pdf-file" type="button">Load PDF file</button>
    </div>
    <p id="pdf-status" role="status" aria-live="polite"></p>

    <div id="controls">
        <button id="prev-page" disabled>Previous</button>
        <span>Page <span id="page-num">1</span> of <span id="page-count">-</span></span>
        <button id="next-page" disabled>Next</button>
    </div>

    <canvas id="pdf-render"></canvas>

    <!-- Include PDF.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="app.js?v=viewer-fix-1"></script>
</body>

</html>
