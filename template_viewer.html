<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wybierz szablon CV, zobacz podgląd i wydrukuj lub zapisz dokument jako PDF.">
    <title>Generator CV</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f3f6fb;
            --surface: #ffffff;
            --surface-muted: #f7f9fc;
            --primary: #3157a4;
            --primary-dark: #24427f;
            --text: #192338;
            --muted: #64718a;
            --border: #dce3ef;
            --focus: #8db4ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 48px 24px;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font: inherit;
        }

        .page {
            width: min(100%, 1080px);
            margin: 0 auto;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .page-heading h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            letter-spacing: -0.04em;
        }

        .page-heading p,
        .preview-heading p {
            margin: 0;
            color: var(--muted);
            line-height: 1.55;
        }

        .template-section,
        .preview-section {
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: 0 12px 32px rgb(34 54 89 / 6%);
        }

        .template-section {
            margin-bottom: 20px;
        }

        .section-heading {
            margin: 0 0 16px;
            font-size: 1.1rem;
        }

        .template-options {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .template-button {
            min-height: 100px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-muted);
            color: var(--text);
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
        }

        .template-button:hover {
            transform: translateY(-2px);
            border-color: #9db5e3;
        }

        .template-button[aria-pressed="true"] {
            border-color: var(--primary);
            background: #edf3ff;
            box-shadow: inset 0 0 0 1px var(--primary);
        }

        .template-button strong,
        .template-button span {
            display: block;
        }

        .template-button strong {
            margin-bottom: 7px;
            font-size: 0.98rem;
        }

        .template-button span {
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.4;
        }

        button:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        .preview-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .preview-heading h2 {
            margin: 0 0 6px;
            font-size: 1.2rem;
        }

        .document-actions {
            display: flex;
            flex: 0 0 auto;
            gap: 10px;
        }

        .action-button {
            min-height: 42px;
            padding: 10px 15px;
            border: 1px solid var(--primary);
            border-radius: 9px;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .action-button:hover:not(:disabled) {
            border-color: var(--primary-dark);
            background: var(--primary-dark);
        }

        .action-button.secondary {
            background: var(--surface);
            color: var(--primary);
        }

        .action-button.secondary:hover:not(:disabled) {
            background: #edf3ff;
        }

        .action-button:disabled {
            border-color: var(--border);
            background: #eef1f6;
            color: #929bad;
            cursor: not-allowed;
        }

        .preview-placeholder {
            display: grid;
            min-height: 440px;
            place-items: center;
            padding: 24px;
            border: 1px dashed #c8d2e2;
            border-radius: 12px;
            background: var(--surface-muted);
            color: var(--muted);
            text-align: center;
        }

        .preview-frame {
            display: block;
            width: 100%;
            height: min(80vh, 1050px);
            min-height: 560px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #e9edf4;
        }

        .preview-frame[hidden] {
            display: none;
        }

        .preview-placeholder[hidden] {
            display: none;
        }

        .status {
            min-height: 1.4em;
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (max-width: 720px) {
            body {
                padding: 28px 16px;
            }

            .template-section,
            .preview-section {
                padding: 18px;
            }

            .template-options {
                grid-template-columns: 1fr;
            }

            .template-button {
                min-height: 0;
            }

            .preview-heading {
                flex-direction: column;
            }
        }

        @media (max-width: 460px) {
            .document-actions {
                width: 100%;
            }

            .action-button {
                flex: 1;
                padding: 10px 8px;
                font-size: 0.88rem;
            }

            .preview-frame {
                min-height: 440px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="page-heading">
            <h1>Generator CV</h1>
            <p>Wybierz jeden z szablonów, aby zobaczyć jego przykładowy podgląd. Edytuj dane na stronie głównej.</p>
        </header>

        <section class="template-section" aria-labelledby="template-heading">
            <h2 class="section-heading" id="template-heading">Wybierz szablon</h2>
            <div class="template-options" aria-label="Szablony CV">
                <button class="template-button" type="button" data-template="templates/black_white.html"
                    aria-pressed="false">
                    <strong>Zdjęcie i układ dwukolumnowy</strong>
                    <span>Wyrazisty, czarno-biały projekt ze zdjęciem.</span>
                </button>
                <button class="template-button" type="button" data-template="templates/no_photo.html"
                    aria-pressed="false">
                    <strong>Klasyczny bez zdjęcia</strong>
                    <span>Przejrzysty układ z naciskiem na doświadczenie.</span>
                </button>
                <button class="template-button" type="button" data-template="templates/simple_photo.html"
                    aria-pressed="false">
                    <strong>Nowoczesny ze zdjęciem</strong>
                    <span>Prosty projekt ze zdjęciem i sekcjami CV.</span>
                </button>
            </div>
        </section>

        <section class="preview-section" aria-labelledby="preview-title">
            <div class="preview-heading">
                <div>
                    <h2 id="preview-title">Podgląd CV</h2>
                    <p>Szablony zawierają przykładowe dane.</p>
                </div>
                <div class="document-actions" aria-label="Akcje dokumentu">
                    <button class="action-button secondary" id="print-cv" type="button" disabled>Drukuj</button>
                    <button class="action-button" id="save-cv" type="button" disabled>Zapisz jako PDF</button>
                </div>
            </div>
            <div class="preview-placeholder" id="preview-placeholder">
                Wybierz szablon powyżej, aby wyświetlić podgląd CV.
            </div>
            <iframe class="preview-frame" id="cv-preview" title="Podgląd wybranego szablonu CV" hidden></iframe>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
